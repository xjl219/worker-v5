name = "worker-v5"
main = "src/index.ts"
compatibility_date = "2026-11-23"

# Pin Worker placement to US West (Oregon) so egress prefers US while allowing
# low-latency Asia-Pacific edge ingress (e.g. HKG) over Cloudflare's backbone.
[placement]
region = "aws:us-west-2"

[observability]
enabled = true

# Non-secret runtime configuration.
# PE is intentionally managed in the Cloudflare dashboard.
[vars]
HE = "false"
OM = "direct"
AP = "80,443,8080,8443,2053,2083,2087,2096"
RE = ""
H = ""
P = "1080"

# Secrets must be configured separately; never commit credentials here:
#   npx wrangler secret put UUID
#   npx wrangler secret put SU
#   npx wrangler secret put SP
