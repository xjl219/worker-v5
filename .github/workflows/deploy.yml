name: Deploy worker-v5

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check types and tests
        run: npm run check
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload VLESS UUID secret
        env:
          WORKER_UUID: ${{ secrets.WORKER_UUID }}
        run: |
          test -n "$WORKER_UUID" || (echo "Missing GitHub secret WORKER_UUID" && exit 1)
          printf '%s' "$WORKER_UUID" | npx wrangler secret put UUID
